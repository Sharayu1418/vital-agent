# Runs on every push and pull request.
#
# This exists because two production outages in one afternoon were both
# caught by tools that already existed and simply were not run:
#
#   - a JSX prop referenced an undefined function, white-screening the
#     whole app. `next build` catches it in two seconds.
#   - a new request header was not added to the CORS allowlist, so every
#     API call failed the browser preflight while the server stayed
#     healthy. The contract test catches it in the backend suite.
#
# Neither needed a smarter test. They needed the existing ones to run
# without anybody having to remember.
#
# Deliberately NOT here: the live evals. test_memory_live, test_crisis_live
# and test_routing all call real models — they cost money, they need
# credentials, and they are flaky in the way anything talking to a hosted
# model is flaky. A CI job that is sometimes red for reasons nobody
# controls gets ignored, and then it protects nothing. Those stay
# explicitly invoked.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: no point finishing a run for code
# that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vital-app
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # uv.lock lives in vital-app, not the repo root.
          #
          # This glob reported "No file matched" even after being pointed at the
          # right path, because uv.lock was in .gitignore and had never been
          # committed. The cache warning was the visible edge of a much larger
          # problem: with no lockfile, `uv sync` resolved fresh from PyPI on
          # every run, so CI never tested the versions the app actually runs.
          cache-dependency-glob: vital-app/uv.lock

      # --locked, not a bare sync: fail loudly if uv.lock is stale or missing
      # rather than silently resolving something else. CI resolving its own
      # dependency versions is CI testing a different application.
      - name: Install dependencies
        run: uv sync --locked --all-extras

      # No credentials are provided on purpose. conftest pins
      # GOOGLE_CLOUD_PROJECT to "test" and patches every network seam, so a
      # suite that needs the internet to pass has a bug in its isolation —
      # and that bug is worth failing over.
      - name: Run tests
        run: uv run pytest -q

      # Blocking, as of the run where somebody finally read the annotations.
      #
      # This was `continue-on-error: true`, described as "advisory for now".
      # What that produced was a job reporting SUCCESS with a red "Process
      # completed with exit code 1" annotation nobody looked at, on every run,
      # for the life of the file. An advisory check that is always failing
      # carries exactly as much information as no check.
      #
      # The backlog turned out to be nine unused imports and one f-string.
      #
      # Then this step failed for a week with 254 errors that no local run
      # could reproduce. uv.lock was gitignored, so CI resolved fresh from
      # PyPI and got a ruff whose DEFAULT rule set is wider — BLE001, DTZ,
      # FLY002 and friends. Two fixes, because either alone leaves a hole:
      # the lockfile is committed now, and pyproject pins an explicit
      # `[tool.ruff.lint] select` so the rules cannot widen underneath us
      # even if the version does.
      - name: Lint
        run: uv run ruff check src tests scripts

      # SECURITY.md used to end its threat model with "dependencies are
      # pinned by lockfile and not currently scanned automatically. That is
      # the most obvious next addition." This is that addition — and it only
      # became possible when uv.lock was committed, because before then there
      # was no stable set of versions to scan.
      #
      # Three deliberate choices:
      #
      # --no-deps, against the EXPORTED lock rather than pyproject. Letting
      # pip-audit resolve its own versions would audit an application nobody
      # runs — the identical mistake as CI resolving fresh from PyPI.
      #
      # `|| true`, because pip-audit exits 1 on any finding at all. Which
      # findings should stop a build is a policy question, and it lives in
      # audit_gate.py where it can be read and tested, not in an exit code.
      #
      # --min-packages, because a scan of nothing exits 0 and renders exactly
      # like a clean scan. That is not hypothetical: the first end-to-end run
      # of this fed pip-audit an empty file and got back "no known
      # vulnerabilities". A green build under a SECURITY.md that claims
      # scanning is worse than the honest paragraph it replaced.
      - name: Export the locked dependency set
        run: >
          uv export --frozen --no-emit-project --no-hashes
          --format requirements-txt -o /tmp/audit-requirements.txt

      - name: Audit dependencies
        run: |
          uv run --with pip-audit pip-audit \
            -r /tmp/audit-requirements.txt --no-deps \
            --format json -o /tmp/audit.json || true
          uv run python scripts/audit_gate.py /tmp/audit.json \
            --ignore-file audit-ignore.txt --min-packages 50

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vital-web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # 20 reached end of life in April 2026 — no security patches. The
          # frontend suite passes on 22; verified locally on 22.22.
          node-version: 22
          cache: pnpm
          cache-dependency-path: vital-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Coarser than the Python gate, on purpose, and worth saying why.
      #
      # audit_gate.py blocks on "a fix exists", which is a far better proxy
      # for "somebody can act on this" than severity. pnpm does not expose
      # that reliably, and writing a parser for its advisory JSON would mean
      # writing one against a shape I could not verify against the real tool
      # — which is exactly how the Python gate came to report a scan of zero
      # packages as clean. So this uses the lever pnpm actually gives.
      #
      # high and above only. Every npm tree carries low-severity advisories
      # in build tooling forever; blocking on those is how a check gets
      # switched off.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Unit tests
        run: pnpm test

      # THE check. `next build` runs lint and type validity, which is what
      # catches an undefined identifier in JSX before it reaches a browser.
      - name: Build
        run: pnpm build
        env:
          # The build fails without an API base by design (P1-11) — a
          # frontend deployed pointing at nothing looks fine and works for
          # nobody. CI only needs it to be present and well-formed.
          NEXT_PUBLIC_API_BASE: https://ci.invalid

  mobile:
    name: mobile check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vital-mobile
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vital-mobile/pnpm-lock.yaml

      # Catches a package.json edited without regenerating the lockfile —
      # the same class of problem as the uv.lock that was never committed.
      - run: pnpm install --frozen-lockfile

      # See the frontend job for why this is severity-based rather than
      # fix-availability-based like the Python gate.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # A full Expo build needs EAS: slow, paid, and overkill for asking
      # "does this still compile". Bundling with the native packages marked
      # external resolves every LOCAL import and parses every file, which
      # catches the two ways this app actually rots — a syntax error, and an
      # import that no longer points at anything. Verified by mutation:
      # renaming ./lib/sky fails with "Could not resolve", and a stray brace
      # fails with "Expected identifier".
      #
      # Until now nothing verified this app at all. The only thing touching
      # it was the byte-identity check on lib/sky.js in the web suite.
      - name: Compile check
        run: >
          npx --yes esbuild@0.25.10 App.jsx --bundle --loader:.jsx=jsx
          --platform=neutral
          --external:react --external:react-native
          --external:expo --external:expo-* --external:expo/*
          --outfile=/dev/null
