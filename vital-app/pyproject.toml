[project]
name = "vital"
version = "0.1.0"
description = "VITAL - multi-agent life copilot (Phase 0: Activity Scout)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain-google-vertexai>=2.0",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.1",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "e2b-code-interpreter>=1.0",
    "python-multipart>=0.0.18",
    "firebase-admin>=6.5",
    # Buddy meeting-point document. Pure Python, no system libraries, and
    # it starts instantly on Cloud Run — a headless-browser renderer would
    # mean shipping Chromium to lay out one page of text.
    "fpdf2>=2.8",
    # Morning brief delivery. Web Push means a VAPID JWT plus AES128GCM
    # payload encryption — not something to hand-roll for a notification.
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.8"]
postgres = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.2"]
observability = ["langsmith>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vital"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_firebase_auth.py imports `tests.test_api_security`, which needs the
# project root on sys.path so `tests` resolves as a namespace package.
# `python -m pytest` adds CWD implicitly, but the `pytest` console script
# (what `uv run pytest` invokes) does not — so the suite passed one way and
# failed 23 tests the other. Pin it here instead of depending on how pytest
# happens to be launched.
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
