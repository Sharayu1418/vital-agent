<!doctype html>
<!--
  The whole day, on one page.

  Open this file directly in a browser — no dev server, no build. It imports
  the real app/lib/sky.js, so what you see here is exactly what the app will
  paint. The tests prove the numbers; this is the part they cannot check.

  What to look for:
    - Does any band look muddy, or green where it should be pale?
    - Do the two rows of text stay comfortable to read the whole way down?
    - Does the accent stay visible against its own background?
    - Does the transition look continuous, or are there visible steps?
-->
<meta charset="utf-8">
<title>VITAL sky palette</title>
<style>
  body { margin: 0; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .row { display: flex; align-items: stretch; min-height: 46px; }
  .swatch { flex: 1; display: flex; align-items: center; gap: 18px; padding: 8px 16px; }
  .alt { width: 74px; font-variant-numeric: tabular-nums; opacity: 0.85; }
  .panel { padding: 5px 10px; border-radius: 8px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; display: inline-block;
         vertical-align: middle; }
  .ratio { margin-left: auto; font-variant-numeric: tabular-nums; opacity: 0.75;
           font-size: 11px; }
  h1 { font: 600 15px/1.4 inherit; padding: 14px 16px 6px; margin: 0; }
  p.note { padding: 0 16px 14px; margin: 0; color: #666; max-width: 70ch; }
</style>

<h1>VITAL sky palette — sun altitude from overhead to night</h1>
<p class="note">
  Rendered from the same <code>app/lib/sky.js</code> the app and the mobile
  client use. Body text targets 7:1 and is guaranteed 4.5:1; the ratio on the
  right is measured, not assumed.
</p>
<div id="out"></div>

<script type="module">
  import { skyColor, contrastRatio } from "../app/lib/sky.js";

  const out = document.getElementById("out");
  // Dense near the horizon, where all the interesting colour happens.
  const altitudes = [];
  for (let a = 80; a > 12; a -= 4) altitudes.push(a);
  for (let a = 12; a >= -20; a -= 0.5) altitudes.push(a);

  out.innerHTML = altitudes.map((alt) => {
    const s = skyColor(alt);
    const body = contrastRatio(s.bg, s.text).toFixed(1);
    const muted = contrastRatio(s.bg, s.muted).toFixed(1);
    return `<div class="row" style="background:${s.bg};color:${s.text}">
      <div class="swatch">
        <span class="alt">${alt.toFixed(1)}&deg;</span>
        <span class="panel" style="background:${s.panel}">panel surface</span>
        <span>Body text on this sky</span>
        <span style="color:${s.muted}">secondary text</span>
        <span class="dot" style="background:${s.accent}"></span>
        <span class="ratio">${body}:1 &middot; ${muted}:1 &middot; ${s.bg}</span>
      </div>
    </div>`;
  }).join("");
</script>
